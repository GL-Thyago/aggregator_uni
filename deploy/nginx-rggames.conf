# Proxy HTTPS do rggames.site → aggregator na porta 3010.
# Coloque em /etc/nginx/sites-available/rggames.site e gere certificado (certbot).

server {
    listen 80;
    server_name rggames.site www.rggames.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rggames.site www.rggames.site;

    # ssl_certificate     /etc/letsencrypt/live/rggames.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rggames.site/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
