<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header><h1>🎲 Dice</h1><div class="balance">Saldo: <strong id="balance">—</strong></div></header>
    <div class="result-box"><div id="roll" class="roll">—</div><div id="hint" class="hint">Role acima ou abaixo do alvo</div></div>
    <div class="controls">
      <label>Aposta <input type="number" id="bet" value="10" min="1"></label>
      <label>Alvo (0–99) <input type="number" id="target" value="50" min="1" max="98"></label>
      <div class="toggle">
        <button type="button" id="btn-over" class="active">ACIMA ▲</button>
        <button type="button" id="btn-under">ABAIXO ▼</button>
      </div>
      <button type="button" id="btn-play" class="play">JOGAR</button>
      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="../_shared/instant-client.js"></script>
  <script src="game.js"></script>
</body>
</html>
