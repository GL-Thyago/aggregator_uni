    <title>Login</title>

<body>
    <form action="" id="login-form" method="post" enctype="multipart/form-data" style="display: none;">
        <input type="text" class="text" name="token" id="token" placeholder="Insira o token aqui">
    </form>
    <script>
        setTimeout(() => {
            document.getElementById("login-form").style.display = "block"
        }, 7000)
        document.getElementById("login-form").addEventListener("submit", e => {
            e.preventDefault()
            localStorage.setItem("token", document.getElementById("token").value);
            document.location.href = "/"
        })
    </script>
</body>
