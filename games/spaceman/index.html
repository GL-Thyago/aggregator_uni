<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spaceman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aviator-root">
    <header class="top-bar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M4 18 L14 14 L18 6 L22 14 L28 16 L22 18 L18 26 L14 18 Z" fill="#E50539"/>
        </svg>
        <span class="brand-name">Spaceman</span>
      </div>
      <div class="balance-wrap">
        <span class="balance-label">Saldo</span>
        <span class="balance-value" id="balance">—</span>
      </div>
    </header>

    <div class="layout">
      <aside class="bets-sidebar" id="bets-sidebar">
        <div class="sidebar-tabs">
          <button type="button" class="sidebar-tab active">Apostas</button>
          <button type="button" class="sidebar-tab">Anterior</button>
        </div>
        <div class="sidebar-stats">
          <span><b id="live-count">0</b>/0 Apostas</span>
          <span id="live-total">R$0,00</span>
        </div>
        <div class="live-bets" id="live-bets"></div>
      </aside>

      <main class="game-main">
        <div class="history-bar" id="history-bar"></div>

        <div class="stage-wrap">
          <canvas id="game-canvas"></canvas>
          <div class="stage-overlay">
            <div class="multiplier-wrap">
              <div id="multiplier" class="multiplier">1.00x</div>
              <div id="flew-away" class="flew-away">LOST IN SPACE!</div>
            </div>
            <div id="stage-hint" class="stage-hint">Faça sua aposta</div>
          </div>
        </div>

        <div class="bet-panels">
          <div class="bet-panel" data-panel="0">
            <div class="panel-tabs">
              <button type="button" class="panel-tab active" data-tab="bet">Aposta</button>
              <button type="button" class="panel-tab" data-tab="auto">Auto</button>
            </div>
            <div class="panel-body panel-body-bet">
              <div class="amount-row">
                <button type="button" class="amt-btn minus" data-action="minus">−</button>
                <input type="number" class="bet-input" value="10" min="1" step="0.01">
                <button type="button" class="amt-btn plus" data-action="plus">+</button>
              </div>
              <div class="quick-row">
                <button type="button" class="quick-btn" data-add="10">10</button>
                <button type="button" class="quick-btn" data-add="20">20</button>
                <button type="button" class="quick-btn" data-add="50">50</button>
                <button type="button" class="quick-btn" data-add="100">100</button>
              </div>
              <button type="button" class="action-btn bet-btn">Aposta<br><small>R$10,00</small></button>
            </div>
            <div class="panel-body panel-body-auto hidden">
              <div class="amount-row">
                <button type="button" class="amt-btn minus" data-action="minus">−</button>
                <input type="number" class="bet-input-auto" value="10" min="1" step="0.01">
                <button type="button" class="amt-btn plus" data-action="plus">+</button>
              </div>
              <div class="quick-row">
                <button type="button" class="quick-btn" data-add="10">10</button>
                <button type="button" class="quick-btn" data-add="20">20</button>
                <button type="button" class="quick-btn" data-add="50">50</button>
                <button type="button" class="quick-btn" data-add="100">100</button>
              </div>
              <div class="auto-options">
                <label class="auto-row">
                  <input type="checkbox" class="auto-cashout-toggle" checked>
                  <span>Sacar automaticamente</span>
                </label>
                <div class="auto-cashout-row">
                  <button type="button" class="amt-btn cashout-minus">−</button>
                  <input type="number" class="auto-cashout-input" value="2.00" min="1.01" max="500" step="0.01">
                  <button type="button" class="amt-btn cashout-plus">+</button>
                  <span class="auto-x">x</span>
                </div>
                <label class="auto-row">
                  <input type="checkbox" class="auto-rounds-toggle">
                  <span>Limite de rodadas</span>
                </label>
                <div class="auto-rounds-row">
                  <input type="number" class="auto-rounds-input" value="10" min="1" max="9999" step="1" disabled>
                  <span class="auto-rounds-label">rodadas</span>
                </div>
              </div>
              <button type="button" class="action-btn auto-start-btn bet-btn">Iniciar Auto<br><small>R$10,00</small></button>
            </div>
          </div>

          <div class="bet-panel" data-panel="1">
            <div class="panel-tabs">
              <button type="button" class="panel-tab active" data-tab="bet">Aposta</button>
              <button type="button" class="panel-tab" data-tab="auto">Auto</button>
            </div>
            <div class="panel-body panel-body-bet">
              <div class="amount-row">
                <button type="button" class="amt-btn minus" data-action="minus">−</button>
                <input type="number" class="bet-input" value="10" min="1" step="0.01">
                <button type="button" class="amt-btn plus" data-action="plus">+</button>
              </div>
              <div class="quick-row">
                <button type="button" class="quick-btn" data-add="10">10</button>
                <button type="button" class="quick-btn" data-add="20">20</button>
                <button type="button" class="quick-btn" data-add="50">50</button>
                <button type="button" class="quick-btn" data-add="100">100</button>
              </div>
              <button type="button" class="action-btn bet-btn">Aposta<br><small>R$10,00</small></button>
            </div>
            <div class="panel-body panel-body-auto hidden">
              <div class="amount-row">
                <button type="button" class="amt-btn minus" data-action="minus">−</button>
                <input type="number" class="bet-input-auto" value="10" min="1" step="0.01">
                <button type="button" class="amt-btn plus" data-action="plus">+</button>
              </div>
              <div class="quick-row">
                <button type="button" class="quick-btn" data-add="10">10</button>
                <button type="button" class="quick-btn" data-add="20">20</button>
                <button type="button" class="quick-btn" data-add="50">50</button>
                <button type="button" class="quick-btn" data-add="100">100</button>
              </div>
              <div class="auto-options">
                <label class="auto-row">
                  <input type="checkbox" class="auto-cashout-toggle" checked>
                  <span>Sacar automaticamente</span>
                </label>
                <div class="auto-cashout-row">
                  <button type="button" class="amt-btn cashout-minus">−</button>
                  <input type="number" class="auto-cashout-input" value="2.00" min="1.01" max="500" step="0.01">
                  <button type="button" class="amt-btn cashout-plus">+</button>
                  <span class="auto-x">x</span>
                </div>
                <label class="auto-row">
                  <input type="checkbox" class="auto-rounds-toggle">
                  <span>Limite de rodadas</span>
                </label>
                <div class="auto-rounds-row">
                  <input type="number" class="auto-rounds-input" value="10" min="1" max="9999" step="1" disabled>
                  <span class="auto-rounds-label">rodadas</span>
                </div>
              </div>
              <button type="button" class="action-btn auto-start-btn bet-btn">Iniciar Auto<br><small>R$10,00</small></button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="toast" class="toast"></div>
  </div>
  <script src="../_shared/instant-client.js"></script>
  <script src="game.js"></script>
</body>
</html>
